[package]
name = "maple-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
maple-protocol.workspace = true
maple-audio.workspace = true
maple-server = {path="../maple-server"}
maple-transport.workspace=true
quinn.workspace=true
zeroize.workspace=true
tokio.workspace = true
serde_json.workspace = true
tiny-skia = "0.11"
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"



unicode-segmentation = "1.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
