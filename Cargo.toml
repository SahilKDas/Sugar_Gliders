[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time","io-util"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
maple-protocol = { path = "crates/maple-protocol" }
maple-audio = { path = "crates/maple-audio" }
maple-transport = {path="crates/maple-transport"}
quinn = {version="0.11",default-features=false,features=["runtime-tokio","rustls-ring"]}
rustls = {version="0.23",default-features=false,features=["std","ring"]}
zeroize = "1"

[profile.dev]
opt-level = 1
debug = 0
strip = true
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

